<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Ravanan — Running Analysis</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #020408;
            --blue: #0ea5e9;
            --violet: #7c3aed;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --glass: rgba(6, 14, 26, 0.75);
            --border: rgba(14, 165, 233, 0.15);
            --t1: #f0f6ff;
            --t2: #8ba5c4;
            --t3: #3a5a7a
        }

        html,
        body {
            height: 100%;
            overflow: auto
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--t1)
        }

        #cvs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }

        .grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(14, 165, 233, .03)1px, transparent 1px), linear-gradient(90deg, rgba(14, 165, 233, .03)1px, transparent 1px);
            background-size: 50px 50px
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(90px);
            z-index: 0
        }

        .orb1 {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(14, 165, 233, .1), transparent 70%);
            top: -200px;
            right: -150px;
            animation: dA 14s ease-in-out infinite
        }

        .orb2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, .08), transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: dB 16s ease-in-out infinite
        }

        @keyframes dA {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-80px, 50px)
            }
        }

        @keyframes dB {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(60px, -40px)
            }
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 16px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(2, 4, 8, .6);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border)
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .8rem;
            color: var(--t2)
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 10px rgba(16, 185, 129, .8);
            animation: pulse 1.5s ease-in-out infinite
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1
            }

            50% {
                transform: scale(1.4);
                opacity: .6
            }
        }

        /* LAYOUT */
        .layout {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 420px;
            grid-template-rows: auto 1fr auto;
            gap: 0;
            padding-top: 64px
        }

        /* LEFT PANEL */
        .left-panel {
            grid-column: 1;
            grid-row: 1/4;
            display: flex;
            flex-direction: column;
            padding: 32px 32px 32px 40px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden
        }

        .company-header {
            margin-bottom: 32px
        }

        .company-tag {
            font-size: .7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--cyan);
            font-weight: 600;
            margin-bottom: 8px
        }

        .company-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 4px
        }

        .company-ticker {
            font-family: 'JetBrains Mono', monospace;
            font-size: .9rem;
            color: var(--t2);
            background: rgba(14, 165, 233, .08);
            border: 1px solid rgba(14, 165, 233, .2);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block
        }

        /* BIG PROGRESS RING */
        .progress-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 32px
        }

        .ring-wrap {
            position: relative;
            width: 260px;
            height: 260px
        }

        .ring-wrap svg {
            transform: rotate(-90deg)
        }

        .ring-bg {
            fill: none;
            stroke: rgba(14, 165, 233, .08);
            stroke-width: 8
        }

        .ring-fill {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset .8s cubic-bezier(.4, 0, .2, 1);
            stroke: url(#ringGrad)
        }

        .ring-glow {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            opacity: .2;
            filter: blur(6px);
            stroke: var(--blue);
            transition: stroke-dashoffset .8s cubic-bezier(.4, 0, .2, 1)
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px
        }

        .ring-pct {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -3px;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .ring-label {
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--t2);
            font-weight: 600;
            text-align: center;
            max-width: 120px
        }

        /* STAGE STEPS */
        .stages {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .stage-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            transition: all .3s;
            border: 1px solid transparent
        }

        .stage-item.done {
            background: rgba(16, 185, 129, .06);
            border-color: rgba(16, 185, 129, .15)
        }

        .stage-item.active {
            background: rgba(14, 165, 233, .08);
            border-color: rgba(14, 165, 233, .25);
            box-shadow: 0 0 20px rgba(14, 165, 233, .1)
        }

        .stage-item.pending {
            opacity: .35
        }

        .stage-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            flex-shrink: 0
        }

        .stage-item.done .stage-icon {
            background: rgba(16, 185, 129, .15);
            color: var(--emerald)
        }

        .stage-item.active .stage-icon {
            background: rgba(14, 165, 233, .15);
            color: var(--blue);
            animation: iconPulse 1s ease-in-out infinite
        }

        .stage-item.pending .stage-icon {
            background: rgba(14, 165, 233, .05);
            color: var(--t3)
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.15)
            }
        }

        .stage-text {
            font-size: .82rem;
            font-weight: 500;
            flex: 1
        }

        .stage-done-check {
            font-size: .8rem;
            color: var(--emerald)
        }

        .stage-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(14, 165, 233, .2);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* RIGHT PANEL - TERMINAL */
        .right-panel {
            grid-column: 2;
            grid-row: 1/4;
            display: flex;
            flex-direction: column;
            background: rgba(3, 7, 12, .8);
            border-left: 1px solid var(--border)
        }

        .terminal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .terminal-title {
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--t3);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .terminal-dots {
            display: flex;
            gap: 6px
        }

        .tdot {
            width: 10px;
            height: 10px;
            border-radius: 50%
        }

        .tdot-r {
            background: #ef4444
        }

        .tdot-y {
            background: #eab308
        }

        .tdot-g {
            background: #22c55e
        }

        .log-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: .7rem;
            color: var(--t3);
            background: rgba(14, 165, 233, .06);
            padding: 3px 8px;
            border-radius: 6px
        }

        .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .72rem;
            line-height: 1.7;
            scrollbar-width: thin;
            scrollbar-color: rgba(14, 165, 233, .2) transparent
        }

        .terminal-body::-webkit-scrollbar {
            width: 4px
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(14, 165, 233, .2);
            border-radius: 2px
        }

        .log-line {
            display: flex;
            gap: 8px;
            padding: 1px 0;
            animation: logIn .2s ease
        }

        @keyframes logIn {
            from {
                opacity: 0;
                transform: translateX(-8px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .log-time {
            color: var(--t3);
            flex-shrink: 0;
            user-select: none
        }

        .log-badge {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 5px
        }

        .log-text {
            color: #93c5fd;
            word-break: break-all
        }

        .log-text.err {
            color: #fca5a5
        }

        .log-text.warn {
            color: #fde68a
        }

        .log-text.success {
            color: #86efac
        }

        .log-text.info {
            color: #93c5fd
        }

        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 13px;
            background: var(--blue);
            animation: blink .8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        /* BOTTOM BAR */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(2, 4, 8, .9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            gap: 20px
        }

        .bar-track {
            flex: 1;
            height: 6px;
            background: rgba(14, 165, 233, .08);
            border-radius: 3px;
            overflow: hidden;
            position: relative
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--blue), var(--violet), var(--cyan));
            transition: width .8s cubic-bezier(.4, 0, .2, 1);
            position: relative
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: rgba(255, 255, 255, .3);
            filter: blur(4px);
            animation: sheen 2s ease-in-out infinite
        }

        @keyframes sheen {

            0%,
            100% {
                opacity: .3
            }

            50% {
                opacity: .8
            }
        }

        .bar-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent);
            animation: shimmer 2s ease infinite;
            background-size: 200% 100%
        }

        @keyframes shimmer {
            0% {
                background-position: -200%
            }

            100% {
                background-position: 200%
            }
        }

        .bar-pct {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            min-width: 44px;
            color: var(--t1)
        }

        .bar-label {
            font-size: .78rem;
            color: var(--t2);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .btn-view {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
            opacity: 0;
            transition: all .4s;
            pointer-events: none;
            font-family: 'Inter', sans-serif
        }

        .btn-view.show {
            opacity: 1;
            pointer-events: auto;
            animation: glowPop .5s ease
        }

        @keyframes glowPop {
            0% {
                box-shadow: 0 0 0 rgba(14, 165, 233, 0)
            }

            100% {
                box-shadow: 0 0 30px rgba(14, 165, 233, .6)
            }
        }

        /* STOP BUTTON */
        .btn-stop {
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 10px;
            color: #f87171;
            font-weight: 600;
            font-size: .82rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all .2s;
            position: relative;
            overflow: hidden;
        }

        .btn-stop:hover {
            background: rgba(239, 68, 68, 0.18);
            border-color: rgba(239, 68, 68, 0.6);
            color: #fca5a5;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .btn-stop:active {
            transform: translateY(0);
        }

        .btn-stop.stopping {
            animation: stopPulse .6s ease-in-out infinite;
            pointer-events: none;
            opacity: .7;
        }

        .btn-stop.hidden {
            display: none;
        }

        .stop-ring {
            width: 13px;
            height: 13px;
            border: 2px solid rgba(248, 113, 113, .3);
            border-top-color: #f87171;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }

        .btn-stop.stopping .stop-ring {
            display: inline-block;
        }

        .btn-stop.stopping .stop-icon {
            display: none;
        }

        @keyframes stopPulse {

            0%,
            100% {
                box-shadow: 0 0 0 rgba(239, 68, 68, 0);
            }

            50% {
                box-shadow: 0 0 16px rgba(239, 68, 68, 0.5);
            }
        }

        /* STOPPED overlay card */
        .done-card.stopped-card {
            border-color: rgba(245, 158, 11, .3);
        }

        .done-card.stopped-card .done-title {
            color: var(--amber);
        }

        /* DONE overlay */
        .done-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 4, 8, .85);
            backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s
        }

        .done-overlay.show {
            opacity: 1;
            pointer-events: auto
        }

        .done-card {
            background: rgba(6, 14, 26, .9);
            border: 1px solid rgba(16, 185, 129, .3);
            border-radius: 28px;
            padding: 56px 64px;
            text-align: center;
            max-width: 460px;
            transform: scale(.8);
            transition: transform .5s cubic-bezier(.34, 1.56, .64, 1)
        }

        .done-overlay.show .done-card {
            transform: scale(1)
        }

        .done-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            animation: pop .5s .3s cubic-bezier(.34, 1.56, .64, 1) both
        }

        @keyframes pop {
            from {
                transform: scale(0)
            }

            to {
                transform: scale(1)
            }
        }

        .done-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: var(--emerald)
        }

        .done-sub {
            color: var(--t2);
            margin-bottom: 32px;
            line-height: 1.6
        }

        .btn-results {
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--emerald), #059669);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 0 30px rgba(16, 185, 129, .4)
        }

        .btn-results:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(16, 185, 129, .6)
        }

        /* Error done card */
        .done-card.err-card {
            border-color: rgba(239, 68, 68, .3)
        }

        .done-card.err-card .done-title {
            color: var(--red)
        }

        @media(max-width:900px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr
            }

            .right-panel {
                display: none
            }
        }
    </style>
</head>

<body>
    <canvas id="cvs"></canvas>
    <div class="grid"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <nav>
        <div class="nav-logo">⬡ Ravanan</div>
        <div class="nav-status">
            <div class="pulse-dot" id="status-dot"></div><span id="status-text">Pipeline Running...</span>
        </div>
    </nav>

    <div class="layout">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="company-header">
                <div class="company-tag">Analysis Target</div>
                <div class="company-name" id="display-company">—</div>
                <div class="company-ticker" id="display-ticker">—</div>
            </div>

            <div class="progress-center">
                <!-- SVG Ring -->
                <div class="ring-wrap">
                    <svg width="260" height="260" viewBox="0 0 260 260">
                        <defs>
                            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#0ea5e9" />
                                <stop offset="50%" stop-color="#7c3aed" />
                                <stop offset="100%" stop-color="#06b6d4" />
                            </linearGradient>
                        </defs>
                        <circle class="ring-bg" cx="130" cy="130" r="110" />
                        <circle class="ring-glow" id="ring-glow" cx="130" cy="130" r="110" stroke-dasharray="691"
                            stroke-dashoffset="691" />
                        <circle class="ring-fill" id="ring-fill" cx="130" cy="130" r="110" stroke-dasharray="691"
                            stroke-dashoffset="691" />
                    </svg>
                    <div class="ring-center">
                        <div class="ring-pct" id="ring-pct">0%</div>
                        <div class="ring-label" id="ring-label">Initializing...</div>
                    </div>
                </div>

                <!-- Stages list -->
                <div class="stages" id="stages-list"></div>
            </div>
        </div>

        <!-- RIGHT PANEL - TERMINAL -->
        <div class="right-panel">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <div class="tdot tdot-r"></div>
                    <div class="tdot tdot-y"></div>
                    <div class="tdot tdot-g"></div>
                </div>
                <div class="terminal-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5" />
                        <line x1="12" y1="19" x2="20" y2="19" />
                    </svg>
                    Pipeline Terminal
                </div>
                <div class="log-count" id="log-count">0 lines</div>
            </div>
            <div class="terminal-body" id="terminal-body">
                <div class="log-line"><span class="log-time">&gt;</span><span class="log-text">Waiting for pipeline to
                        start...</span><span class="cursor-blink"></span></div>
            </div>
        </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <div class="bar-pct" id="bar-pct">0%</div>
        <div class="bar-track">
            <div class="bar-fill" id="bar-fill" style="width:0%">
                <div class="bar-shimmer"></div>
            </div>
        </div>
        <div class="bar-label" id="bar-label">Starting pipeline...</div>
        <button class="btn-stop" id="btn-stop" onclick="stopPipeline()">
            <svg class="stop-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                <rect x="4" y="4" width="16" height="16" rx="2" />
            </svg>
            <div class="stop-ring"></div>
            Stop
        </button>
        <button class="btn-view" id="btn-view-results">View Results →</button>
    </div>

    <!-- DONE OVERLAY -->
    <div class="done-overlay" id="done-overlay">
        <div class="done-card" id="done-card">
            <div class="done-icon" id="done-icon">🎉</div>
            <div class="done-title" id="done-title">Analysis Complete!</div>
            <div class="done-sub" id="done-sub">Your research pipeline finished successfully. All data has been saved to
                MongoDB.</div>
            <button class="btn-results" id="btn-done-results">View Full Report →</button>
        </div>
    </div>

    <script>
        // ── Canvas Particles with connecting lines ──
        const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
        function resize() { cvs.width = innerWidth; cvs.height = innerHeight } resize();
        window.addEventListener('resize', resize);
        const pts = Array.from({ length: 60 }, () => ({ x: Math.random() * cvs.width, y: Math.random() * cvs.height, vx: (Math.random() - .5) * .2, vy: (Math.random() - .5) * .2, r: Math.random() + .3, a: Math.random() * .3 + .05, col: Math.random() > .5 ? '14,165,233' : '124,58,237' }));
        (function draw() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            pts.forEach(p => {
                p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = cvs.width; if (p.x > cvs.width) p.x = 0; if (p.y < 0) p.y = cvs.height; if (p.y > cvs.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(${p.col},${p.a})`; ctx.fill();
            });
            for (let i = 0; i < pts.length; i++)for (let j = i + 1; j < pts.length; j++) { const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = Math.sqrt(dx * dx + dy * dy); if (d < 90) { ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.strokeStyle = `rgba(14,165,233,${.05 * (1 - d / 90)})`; ctx.lineWidth = .5; ctx.stroke(); } }
            requestAnimationFrame(draw);
        })();

        // ── Get URL params ──
        const params = new URLSearchParams(location.search);
        const company = params.get('company') || 'Company';
        const ticker = params.get('ticker') || 'TICK';
        document.getElementById('display-company').textContent = company;
        document.getElementById('display-ticker').textContent = ticker;

        // ── Pipeline stages config ──
        const STAGES = [
            { key: 'Initializing Pipeline', label: 'Initializing Pipeline', icon: '⚙️' },
            { key: 'Checking System', label: 'System Check', icon: '🖥️' },
            { key: 'Starting Search', label: 'Starting Search Pipeline', icon: '🔍' },
            { key: 'top-down search', label: 'Top-Down Search', icon: '🌐' },
            { key: 'bottom-up search', label: 'Bottom-Up Search', icon: '🔬' },
            { key: 'CANSLIM search', label: 'CANSLIM Search', icon: '📊' },
            { key: 'links to process', label: 'Links Discovered', icon: '🌐' },
            { key: 'financial data', label: 'Fetching Financial Data', icon: '💹' },
            { key: 'Financial data', label: 'Financial Data Saved', icon: '💾' },
            { key: 'before summarization', label: 'Preparing AI Suggestions', icon: '⏸️' },
            { key: 'top-down summarization', label: 'Top-Down AI Suggestion', icon: '🤖' },
            { key: 'bottom-up summarization', label: 'Bottom-Up AI Suggestion', icon: '🤖' },
            { key: 'CANSLIM summarization', label: 'CANSLIM AI Suggestion', icon: '🤖' },
            { key: 'summarizations completed', label: 'All AI Suggestions Done', icon: '✅' },
            { key: 'pipeline completed', label: 'Pipeline Complete', icon: '🎉' },
        ];

        const stagesList = document.getElementById('stages-list');
        const stageEls = [];
        STAGES.forEach((s, i) => {
            const el = document.createElement('div');
            el.className = 'stage-item pending';
            el.id = 'stage-' + i;
            el.innerHTML = `<div class="stage-icon">${s.icon}</div><div class="stage-text">${s.label}</div><div class="stage-right"></div>`;
            stagesList.appendChild(el); stageEls.push(el);
        });

        let completedStages = new Set(), activeStage = -1;

        function activateStage(idx) {
            if (idx === activeStage) return;
            if (activeStage >= 0) {
                stageEls[activeStage].className = 'stage-item done';
                stageEls[activeStage].querySelector('.stage-right').innerHTML = '<span class="stage-done-check">✓</span>';
                completedStages.add(activeStage);
            }
            activeStage = idx;
            if (idx < stageEls.length) {
                stageEls[idx].className = 'stage-item active';
                stageEls[idx].querySelector('.stage-right').innerHTML = '<div class="stage-spinner"></div>';
                stageEls[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        function completeAllStages() {
            stageEls.forEach((el, i) => {
                el.className = 'stage-item done';
                el.querySelector('.stage-right').innerHTML = '<span class="stage-done-check">✓</span>';
            });
        }

        // ── Progress ring ──
        const CIRCUM = 2 * Math.PI * 110;
        const ringFill = document.getElementById('ring-fill');
        const ringGlow = document.getElementById('ring-glow');
        const ringPct = document.getElementById('ring-pct');
        const ringLabel = document.getElementById('ring-label');
        const barFill = document.getElementById('bar-fill');
        const barPct = document.getElementById('bar-pct');
        const barLabel = document.getElementById('bar-label');
        let currentPct = 0;

        function setProgress(pct, label) {
            currentPct = Math.max(currentPct, pct);
            const offset = CIRCUM - (currentPct / 100) * CIRCUM;
            ringFill.style.strokeDasharray = CIRCUM;
            ringFill.style.strokeDashoffset = offset;
            ringGlow.style.strokeDasharray = CIRCUM;
            ringGlow.style.strokeDashoffset = offset;
            ringPct.textContent = Math.round(currentPct) + '%';
            ringLabel.textContent = label || 'Processing...';
            barFill.style.width = currentPct + '%';
            barPct.textContent = Math.round(currentPct) + '%';
            barLabel.textContent = label || 'Processing...';
        }

        // ── Terminal ──
        const termBody = document.getElementById('terminal-body');
        let logCount = 0;
        const cursor = termBody.querySelector('.cursor-blink');

        function addLog(msg, type = 'info') {
            if (cursor) cursor.remove();
            logCount++;
            const now = new Date();
            const t = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            let cls = 'info';
            if (/error|❌|critical/i.test(msg)) cls = 'err';
            else if (/warning|warn|⚠️/i.test(msg)) cls = 'warn';
            else if (/✅|success|completed|done/i.test(msg)) cls = 'success';

            const colors = { '14,165,233': 'dot-blue', '124,58,237': 'dot-violet' };
            const dotColor = cls === 'err' ? '#ef4444' : cls === 'warn' ? '#eab308' : cls === 'success' ? '#22c55e' : '#0ea5e9';

            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="log-time">${t}</span><span class="log-badge" style="background:${dotColor}"></span><span class="log-text ${cls}">${escHtml(msg)}</span>`;
            termBody.appendChild(line);

            // Re-add cursor
            const newCursor = document.createElement('span');
            newCursor.className = 'cursor-blink';
            const lastLine = document.createElement('div');
            lastLine.className = 'log-line';
            lastLine.innerHTML = `<span class="log-time">&gt;</span>&nbsp;`;
            lastLine.appendChild(newCursor);
            termBody.appendChild(lastLine);

            termBody.scrollTop = termBody.scrollHeight;
            document.getElementById('log-count').textContent = logCount + ' lines';

            if (logCount > 500) {
                const lines = termBody.querySelectorAll('.log-line');
                if (lines.length > 400) lines[0].remove();
            }
        }

        function escHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── SSE Connection ──
        const evtSource = new EventSource(`/api/run?company=${encodeURIComponent(company)}&ticker=${encodeURIComponent(ticker)}`);

        evtSource.onmessage = function (e) {
            const data = JSON.parse(e.data);

            if (data.type === 'start') {
                addLog('🚀 ' + data.message, 'info');
                setProgress(0, 'Initializing Pipeline');
                activateStage(0);
            }

            else if (data.type === 'log') {
                addLog(data.message, data.isError ? 'err' : 'info');
                // Match stage
                STAGES.forEach((s, i) => {
                    if (data.message.toLowerCase().includes(s.key.toLowerCase()) && !completedStages.has(i)) {
                        activateStage(i);
                    }
                });
            }

            else if (data.type === 'progress') {
                setProgress(data.progress, data.label);
            }

            else if (data.type === 'done') {
                evtSource.close();
                document.getElementById('btn-stop').classList.add('hidden');
                document.getElementById('status-dot').style.background = data.success ? '#22c55e' : '#ef4444';
                document.getElementById('status-dot').style.animation = 'none';
                document.getElementById('status-text').textContent = data.success ? 'Pipeline Complete' : 'Pipeline Failed';

                if (data.success) {
                    setProgress(100, 'All Done!');
                    completeAllStages();
                    addLog('🎉 ' + data.message, 'success');
                    document.getElementById('btn-view-results').classList.add('show');
                    setTimeout(() => {
                        document.getElementById('done-overlay').classList.add('show');
                    }, 1200);
                } else {
                    addLog('❌ ' + data.message, 'err');
                    document.getElementById('done-card').classList.add('err-card');
                    document.getElementById('done-icon').textContent = '💔';
                    document.getElementById('done-title').textContent = 'Pipeline Failed';
                    document.getElementById('done-sub').textContent = data.message;
                    document.getElementById('btn-done-results').style.background = 'linear-gradient(135deg,#ef4444,#dc2626)';
                    document.getElementById('btn-done-results').textContent = 'Try Again';
                    setTimeout(() => { document.getElementById('done-overlay').classList.add('show'); }, 800);
                }
            }

            else if (data.type === 'stopped') {
                evtSource.close();
                document.getElementById('btn-stop').classList.add('hidden');
                document.getElementById('status-dot').style.background = '#f59e0b';
                document.getElementById('status-dot').style.animation = 'none';
                document.getElementById('status-text').textContent = 'Pipeline Stopped';
                barLabel.textContent = 'Stopped by user';
                addLog('🛑 ' + data.message, 'warn');
                // Show stopped overlay
                document.getElementById('done-card').classList.add('stopped-card');
                document.getElementById('done-icon').textContent = '🛑';
                document.getElementById('done-title').textContent = 'Pipeline Stopped';
                document.getElementById('done-title').style.color = '#f59e0b';
                document.getElementById('done-sub').textContent = 'The analysis was stopped. You can start again with a new analysis.';
                document.getElementById('btn-done-results').style.background = 'linear-gradient(135deg,#f59e0b,#d97706)';
                document.getElementById('btn-done-results').textContent = '↩ New Analysis';
                setTimeout(() => { document.getElementById('done-overlay').classList.add('show'); }, 600);
            }

            else if (data.type === 'error') {
                addLog('❌ ' + data.message, 'err');
                evtSource.close();
            }
        };

        evtSource.onerror = () => {
            addLog('⚠️ Connection to server lost.', 'warn');
        };

        // ── Navigate to results ──
        function goToResults() {
            window.location.href = '/results?company=' + encodeURIComponent(company) + '&ticker=' + encodeURIComponent(ticker);
        }
        document.getElementById('btn-view-results').addEventListener('click', goToResults);
        document.getElementById('btn-done-results').addEventListener('click', () => {
            const isStopped = document.getElementById('done-card').classList.contains('stopped-card');
            const isErr = document.getElementById('done-card').classList.contains('err-card');
            if (isStopped || isErr) window.location.href = '/analyze';
            else goToResults();
        });

        // ── Stop Pipeline ──
        async function stopPipeline() {
            const confirmed = confirm('⚠️ Are you sure you want to stop the running pipeline?\n\nAll progress so far will be lost.');
            if (!confirmed) return;

            const btn = document.getElementById('btn-stop');
            btn.classList.add('stopping');
            btn.querySelector('.stop-ring').style.display = 'inline-block';

            try {
                const res = await fetch('/api/stop', { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    addLog('🛑 Stop signal sent — pipeline is terminating...', 'warn');
                } else {
                    addLog('⚠️ ' + result.message, 'warn');
                    btn.classList.remove('stopping');
                }
            } catch (err) {
                addLog('❌ Failed to stop: ' + err.message, 'err');
                btn.classList.remove('stopping');
            }
        }
    </script>
</body>

</html>
